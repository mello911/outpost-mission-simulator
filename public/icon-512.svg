<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="planetGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc3d21"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="ringGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad512)"/>
  <rect width="508" height="508" x="2" y="2" rx="94" fill="none" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Orbital Ring 1 (Back) -->
  <ellipse cx="256" cy="256" rx="190" ry="64" fill="none" stroke="url(#ringGrad512)" stroke-width="8" transform="rotate(-28 256 256)" filter="url(#glow512)" opacity="0.85"/>

  <!-- Celestial Sphere (Mars / Moon) -->
  <circle cx="256" cy="256" r="105" fill="url(#planetGrad512)" stroke="#ff8a65" stroke-width="3"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Orbital Ring 2 (Front Overlap) -->
  <path d="M 110 330 A 190 64 0 0 0 405 180" fill="none" stroke="#00e5ff" stroke-width="9" transform="rotate(-28 256 256)" stroke-linecap="round"/>

  <!-- Outpost Center Vector Rocket & Beacon -->
  <polygon points="256,165 288,228 268,228 268,288 244,288 244,228 224,228" fill="#ffffff" filter="url(#glow512)"/>
  <circle cx="256" cy="256" r="12" fill="#00e5ff"/>

  <!-- Deep Space Stars -->
  <circle cx="110" cy="120" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="390" cy="100" r="4" fill="#00e5ff" opacity="0.9"/>
  <circle cx="420" cy="380" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="95" cy="390" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="256" cy="70" r="2.5" fill="#ffffff" opacity="0.75"/>
</svg>
