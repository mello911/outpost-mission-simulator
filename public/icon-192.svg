<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc3d21"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="36" fill="url(#bgGrad)"/>
  <rect width="190" height="190" x="1" y="1" rx="35" fill="none" stroke="#00e5ff" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Orbital Ring 1 -->
  <ellipse cx="96" cy="96" rx="72" ry="24" fill="none" stroke="url(#ringGrad)" stroke-width="3" transform="rotate(-28 96 96)" filter="url(#glow)" opacity="0.85"/>

  <!-- Celestial Body / Moon-Mars -->
  <circle cx="96" cy="96" r="38" fill="url(#planetGrad)" stroke="#ff8a65" stroke-width="1.5"/>
  <circle cx="96" cy="96" r="38" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Orbital Ring 2 Overlap -->
  <path d="M 40 125 A 72 24 0 0 0 152 67" fill="none" stroke="#00e5ff" stroke-width="3.5" transform="rotate(-28 96 96)" stroke-linecap="round"/>

  <!-- Outpost Center Apex -->
  <polygon points="96,62 108,86 100,86 100,108 92,108 92,86 84,86" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="96" cy="96" r="5" fill="#00e5ff"/>

  <!-- Stars -->
  <circle cx="42" cy="48" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="150" cy="40" r="2" fill="#00e5ff" opacity="0.9"/>
  <circle cx="160" cy="140" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="36" cy="145" r="1.8" fill="#fbbf24" opacity="0.8"/>
</svg>
